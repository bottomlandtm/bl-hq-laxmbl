<style>
:root{--bg:#0a0a0e;--gold:#c9a45c;--t1:#f3f1ee;--t2:rgba(243,241,238,.72);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);font:16px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:28rem;margin:0 auto;padding:28px 20px 48px}
img.logo{display:block;height:52px;margin:0 auto 18px;filter:invert(1)}
h1{font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-align:center;margin:0 0 8px}
p.lead{text-align:center;color:var(--t2);margin:0 0 28px}
a.login{display:block;width:100%;padding:16px 18px;margin:0 0 12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;color:var(--t1);text-decoration:none;font-weight:650;font-size:1.05rem}
a.login:hover,a.login:focus{border-color:var(--gold);background:rgba(201,164,92,.12)}
a.login small{display:block;font-weight:400;color:var(--t2);font-size:.85rem;margin-top:2px}
footer{margin-top:28px;text-align:center;color:var(--t2);font-size:.8rem}
</style>
